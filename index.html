<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><title>Geo Alert</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:20px;background:#f5f5f7;color:#111}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #0001}button{width:100%;padding:15px;border:0;border-radius:12px;background:#111;color:#fff;font-size:16px;margin:6px 0}button.secondary{background:#e5e5ea;color:#111}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccc;border-radius:10px;margin:5px 0 10px;font-size:16px}.small{color:#666;font-size:14px}.ok{color:#16803c;font-weight:600}.warn{color:#b45309;font-weight:600}</style></head><body><h1>📍 Geo Alert</h1><div class="card"><div id="status">Konum takibi kapalı.</div><div class="small" id="coords">Konum alınmadı.</div><div class="small" id="accuracy"></div><button onclick="start()">📍 Konum Takibini Başlat</button><button onclick="addCurrent()">➕ Bulunduğum Konumu Ekle</button><button class="secondary" onclick="testSound()">🔊 Sesli Uyarıyı Test Et</button></div><div class="card"><h3>Yeni konum</h3><input id="name" placeholder="Konum adı"><input id="lat" type="number" step="any" placeholder="Enlem"><input id="lon" type="number" step="any" placeholder="Boylam"><input id="radius" type="number" value="3000" placeholder="Yarıçap (metre)"><button onclick="addZone()">Konumu Ekle</button></div><div class="card"><h3>Durum</h3><div id="distance">Henüz konum kontrol edilmedi.</div></div><div class="card"><h3>Kayıtlı konumlar</h3><div id="zones"></div></div><script>
let watchId=null,current=null,zones=JSON.parse(localStorage.getItem("geoZones")||"[]"),alerted={};
function save(){localStorage.setItem("geoZones",JSON.stringify(zones));render()}function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function render(){let b=document.getElementById("zones");b.innerHTML="";if(!zones.length){b.innerHTML='<div class="small">Henüz konum eklenmedi.</div>';return}zones.forEach((z,i)=>{let d=document.createElement("div");d.className="card";d.innerHTML=`<b>${esc(z.name)}</b><br><span class="small">${z.lat.toFixed(6)}, ${z.lon.toFixed(6)} · yarıçap ${z.radius} m</span><button class="secondary" onclick="removeZone(${i})">Sil</button>`;b.appendChild(d)})}
function addZone(){let name=document.getElementById("name").value.trim()||"Kayıtlı konum",lat=Number(document.getElementById("lat").value),lon=Number(document.getElementById("lon").value),radius=Number(document.getElementById("radius").value)||3000;if(!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180){alert("Koordinatları kontrol et.");return}zones.push({name,lat,lon,radius});save();checkCurrent()}
function addCurrent(){if(!current){alert("Önce Konum Takibini Başlat'a bas.");return}document.getElementById("name").value="Bulunduğum konum";document.getElementById("lat").value=current.lat;document.getElementById("lon").value=current.lon;document.getElementById("radius").value=3000;addZone()}
function removeZone(i){zones.splice(i,1);save()}
function distance(a,b,c,d){let R=6371000,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p,q=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return 2*R*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}
function speak(t){let u=new SpeechSynthesisUtterance(t);u.lang="tr-TR";u.rate=.9;u.volume=1;speechSynthesis.cancel();speechSynthesis.speak(u)}
function testSound(){speak("Geo Alert sesli uyarı testi. Ses çalışıyor.")}
function checkCurrent(){if(!current)return;let inside=false;zones.forEach((z,i)=>{let d=distance(current.lat,current.lon,z.lat,z.lon);if(d<=z.radius){inside=true;document.getElementById("distance").innerHTML=`<span class="warn">⚠️ ${esc(z.name)} bölgesindesin.</span> Mesafe: ${Math.round(d)} m`;let k=z.name+"_"+i;if(!alerted[k]){alerted[k]=Date.now();speak(`Dikkat. ${z.name} bölgesine girdin. Mesafe yaklaşık ${Math.round(d)} metre.`)}}});if(!inside&&zones.length)document.getElementById("distance").textContent="Kayıtlı bölgelerin dışındasın."}
function update(p){current={lat:p.coords.latitude,lon:p.coords.longitude};document.getElementById("coords").textContent=`${current.lat.toFixed(6)}, ${current.lon.toFixed(6)}`;document.getElementById("accuracy").textContent=`GPS doğruluğu: yaklaşık ±${Math.round(p.coords.accuracy)} m`;document.getElementById("status").innerHTML='<span class="ok">🟢 Konum takibi açık</span>';checkCurrent()}
function start(){if(!navigator.geolocation){alert("Bu tarayıcı konumu desteklemiyor.");return}navigator.geolocation.getCurrentPosition(update,e=>document.getElementById("status").textContent="Konum alınamadı: "+e.message,{enableHighAccuracy:true,maximumAge:0,timeout:20000});if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=navigator.geolocation.watchPosition(update,e=>document.getElementById("status").textContent="Konum hatası: "+e.message,{enableHighAccuracy:true,maximumAge:3000,timeout:20000})}render();
</script></body></html>
