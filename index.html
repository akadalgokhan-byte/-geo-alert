<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111">
  <title>Geo Alert Pro</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 20px; background: #f5f5f7; color: #111; }
    .card { background: #fff; border-radius: 18px; padding: 18px; margin: 12px 0; box-shadow: 0 2px 12px #0001; }
    button { width: 100%; padding: 15px; border: 0; border-radius: 12px; background: #111; color: #fff; font-size: 16px; margin: 6px 0; cursor: pointer; font-weight: 600; }
    button.secondary { background: #e5e5ea; color: #111; }
    button.danger { background: #ff3b30; color: #fff; }
    input { width: 100%; box-sizing: border-box; padding: 13px; border: 1px solid #ccc; border-radius: 10px; margin: 5px 0 10px; font-size: 16px; }
    .small { color: #666; font-size: 14px; }
    .ok { color: #16803c; font-weight: 600; }
    .warn { color: #b45309; font-weight: 600; }
    .zone-item { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; padding: 12px; background: #f9f9fb; border-radius: 12px; }
    .zones-list { max-height: 400px; overflow-y: auto; }
  </style>
</head>
<body>

  <h1>📍 Geo Alert</h1>

  <div class="card">
    <div id="status">Konum takibi kapalı.</div>
    <div class="small" id="coords">Konum alınmadı.</div>
    <div class="small" id="accuracy"></div>
    <button onclick="start()">📍 Konum Takibini Başlat</button>
    <button onclick="addCurrent()">➕ Bulunduğum Konumu Ekle</button>
    <button class="secondary" onclick="testSound()">🔊 Sesli Uyarıyı Test Et</button>
  </div>

  <div class="card">
    <h3>Yeni Konum Ekle</h3>
    <input id="name" placeholder="Konum adı">
    <input id="lat" type="number" step="any" placeholder="Enlem (Latitude)">
    <input id="lon" type="number" step="any" placeholder="Boylam (Longitude)">
    <input id="radius" type="number" value="3000" placeholder="Yarıçap (metre)">
    <button onclick="addZone()">Konumu Kaydet</button>
  </div>

  <div class="card">
    <h3>Canlı Durum</h3>
    <div id="distance">Henüz konum kontrol edilmedi.</div>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3>Kayıtlı Konumlar (<span id="zone-count">0</span>)</h3>
      <button class="secondary" style="width:auto; padding:6px 12px; font-size:12px;" onclick="resetToDefaultZones()">85 Varsayılanı Yükle</button>
    </div>
    <input id="search" placeholder="Konumlarda ara..." oninput="render()">
    <div class="zones-list" id="zones"></div>
  </div>

let watchId = null;
let current = null;
let zones = JSON.parse(localStorage.getItem("geoZones"));

if (!zones || zones.length === 0) {
  zones = DEFAULT_ZONES;
  localStorage.setItem("geoZones", JSON.stringify(zones));
}

let activeAlerts = new Set();

function resetToDefaultZones() {
  if (confirm("Kayıtlı konumlar sıfırlanıp 85 varsayılan konum yüklensin mi?")) {
    zones = Array.from(DEFAULT_ZONES);
    localStorage.setItem("geoZones", JSON.stringify(zones));
    render();
  }
}

function save() {
  localStorage.setItem("geoZones", JSON.stringify(zones));
  render();
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[m]));
}

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = "sine";
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.1, ctx.currentTime);
    osc.start();
    osc.stop(ctx.currentTime + 0.3);
  } catch(e) {}
}

function speak(text) {
  playBeep();
  setTimeout(() => {
    let u = new SpeechSynthesisUtterance(text);
    u.lang = "tr-TR";
    u.rate = 0.95;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }, 300);
}

function testSound() {
  speak("Geo Alert sesli uyarı testi. Sistem sorunsuz çalışıyor.");
}

function distance(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const p = Math.PI / 180;
  const a = Math.sin((lat2 - lat1) * p / 2) ** 2 +
            Math.cos(lat1 * p) * Math.cos(lat2 * p) *
            Math.sin((lon2 - lon1) * p / 2) ** 2;
  return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function render() {
  let b = document.getElementById("zones");
  let query = (document.getElementById("search")?.value || "").toLowerCase();
  document.getElementById("zone-count").textContent = zones.length;
  b.innerHTML = "";

  if (!zones.length) {
    b.innerHTML = '<div class="small">Henüz kayıtlı bir konum bulunmuyor.</div>';
    return;
  }

  let list = zones.map((z, i) => ({ ...z, originalIndex: i }));

  if (current) {
    list.forEach(z => z.dist = distance(current.lat, current.lon, z.lat, z.lon));
    list.sort((a, b) => a.dist - b.dist);
  }

  list.filter(z => z.name.toLowerCase().includes(query)).forEach((z) => {
    let distText = z.dist !== undefined ? `<br><span class="small" style="color:#007aff;">Mesafe: ${Math.round(z.dist)} m</span>` : '';
    let d = document.createElement("div");
    d.className = "zone-item";
    d.innerHTML = `
      <div>
        <b>${esc(z.name)}</b><br>
        <span class="small">${z.lat.toFixed(6)}, ${z.lon.toFixed(6)} · Yarıçap: ${z.radius}m</span>
        ${distText}
      </div>
      <button class="danger" style="width:auto; padding:6px 10px; font-size:12px;" onclick="removeZone(${z.originalIndex})">Sil</button>
    `;
    b.appendChild(d);
  });
}

function addZone() {
  let name = document.getElementById("name").value.trim() || "Kayıtlı Bölge";
  let lat = Number(document.getElementById("lat").value);
  let lon = Number(document.getElementById("lon").value);
  let radius = Number(document.getElementById("radius").value) || 3000;

  if (!Number.isFinite(lat) || !Number.isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) {
    alert("Lütfen geçerli enlem ve boylam değerleri girin.");
    return;
  }

  zones.push({ name, lat, lon, radius });
  save();
  checkCurrent();
  
  document.getElementById("name").value = "";
  document.getElementById("lat").value = "";
  document.getElementById("lon").value = "";
}

function addCurrent() {
  if (!current) {
    alert("Önce Konum Takibini Başlat butonuna basarak konumunuzu alın.");
    return;
  }
  document.getElementById("name").value = "Mevcut Konum";
  document.getElementById("lat").value = current.lat;
  document.getElementById("lon").value = current.lon;
}

function removeZone(i) {
  zones.splice(i, 1);
  save();
}

function checkCurrent() {
  if (!current) return;
  let insideZones = [];

  zones.forEach((z, i) => {
    let d = distance(current.lat, current.lon, z.lat, z.lon);
    let key = z.name + "_" + i;

    if (d <= z.radius) {
      insideZones.push(`${esc(z.name)} (${Math.round(d)}m)`);
      if (!activeAlerts.has(key)) {
        activeAlerts.add(key);
        speak(`Dikkat! ${z.name} bölgesine girdiniz. Mesafe yaklaşık ${Math.round(d)} metre.`);
      }
    } else {
      if (activeAlerts.has(key)) {
        activeAlerts.delete(key);
        speak(`${z.name} bölgesinden çıktınız.`);
      }
    }
  });

  let statusDiv = document.getElementById("distance");
  if (insideZones.length > 0) {
    statusDiv.innerHTML = `<span class="warn">⚠️ Bölge İçindesiniz:</span><br>${insideZones.join("<br>")}`;
  } else if (zones.length > 0) {
    statusDiv.textContent = "Kayıtlı bölgelerin dışındasınız.";
  } else {
    statusDiv.textContent = "Henüz bölge eklenmedi.";
  }

  render();
}

function update(p) {
  current = { lat: p.coords.latitude, lon: p.coords.longitude };
  document.getElementById("coords").textContent = `${current.lat.toFixed(6)}, ${current.lon.toFixed(6)}`;
  document.getElementById("accuracy").textContent = `GPS Doğruluğu: ±${Math.round(p.coords.accuracy)} m`;
  document.getElementById("status").innerHTML = '<span class="ok">🟢 Konum Takibi Aktif</span>';
  checkCurrent();
}

function start() {
  if (!navigator.geolocation) {
    alert("Tarayıcınız konum servislerini desteklemiyor.");
    return;
  }
  
  if ('wakeLock' in navigator) {
    navigator.wakeLock.request('screen').catch(()=>{});
  }

  navigator.geolocation.getCurrentPosition(update, e => {
    document.getElementById("status").textContent = "Konum alınamadı: " + e.message;
  }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });

  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  
  watchId = navigator.geolocation.watchPosition(update, e => {
    document.getElementById("status").textContent = "Konum hatası: " + e.message;
  }, { enableHighAccuracy: true, maximumAge: 2000, timeout: 20000 });
}

render();
</script>
